[package]
name = "flowie-app"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "flowie"
path = "src/main.rs"

[features]
# `shot.*` agent methods and a fixed window size, for scripts/screenshots.py. Not for releases.
screenshots = []

[dependencies]
gpui.workspace = true
flowie-core.workspace = true
flowie-doc.workspace = true
# iCloud sync on macOS (a no-op elsewhere: it builds without its Swift bridge).
flowie-cloudkit = { path = "../flowie-cloudkit" }
flowie-math.workspace = true
flowie-sync = { workspace = true, features = ["http"] }
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
dirs = "5"
sys-locale = "0.3"
interprocess = "2.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
