name: Release

# Push a tag vX.Y.Z (matching Cargo.toml) to publish a GitHub release whose notes are that
# version's section of CHANGELOG.md. Source only: the signed app is distributed through
# the Mac App Store.
on:
  push:
    tags: ["v*"]
  # Rewrites an existing release's notes from main's CHANGELOG.md, e.g. after fixing an entry.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)publish, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag matches its Cargo version
        run: |
          version=$(git show "$TAG:Cargo.toml" | sed -nE '/^\[workspace.package\]/,/^\[/ s/^version = "(.*)"/\1/p')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          {
            scripts/changelog-section.sh "${TAG#v}"
            echo
            echo "---"
            echo
            echo "**Get Flowie** on the [Mac App Store](https://apps.apple.com/app/id6835913837), or [build it from source](https://github.com/wesleyel/flowie/blob/$TAG/docs/building.md)."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Flowie ${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi
