<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowie</title>
<style>
  :root { color-scheme: light dark; --muted: #888; --accent: #3b82f6; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  #status { font-size: 12px; color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; }
  li.done .text { color: var(--muted); text-decoration: line-through; }
  .text { flex: 1; outline: none; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  form input { flex: 1; font: inherit; padding: 4px 8px; }
  .setup { display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
  .setup input { font: inherit; padding: 4px 8px; }
</style>
</head>
<body>
<header><h1>Flowie</h1><span id="status">starting…</span></header>
<main id="main"></main>
<script type="module" src="app.js"></script>
</body>
</html>
