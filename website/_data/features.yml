# Home page feature cards. `icon` picks a glyph in _includes/icon.html; `tint` a tile colour in style.css.
- icon: write
  tint: blue
  en:
    title: Write and organize
    items:
      - "Every bullet is a page — zoom in to focus, out for the big picture"
      - "Headings, to-dos, numbered lists, quotes and code blocks"
      - "Bold, italic, highlight, colors and links from the keyboard or the <code>/</code> menu"
      - "Notes under any bullet, plus images with captions"
  zh:
    title: 书写与整理
    items:
      - "每个条目都是一个页面：进入专注细节，退出纵览全局"
      - "标题、待办、编号列表、引用、代码块"
      - "加粗、斜体、高亮、颜色和链接，快捷键或 <code>/</code> 菜单即可"
      - "条目可以加备注，图片也能加说明"
- icon: math
  tint: purple
  en:
    title: Math
    items:
      - "Inline <code>$…$</code> and display <code>$$…$$</code> LaTeX"
      - "Rendered natively as you type, with a live preview"
  zh:
    title: 数学公式
    items:
      - "行内 <code>$…$</code> 与独立 <code>$$…$$</code> LaTeX 公式"
      - "原生实时渲染，编辑时即时预览"
- icon: link
  tint: green
  en:
    title: Connect ideas
    items:
      - "<code>[[</code> links with hover previews and backlinks"
      - "Mirrors: one bullet in several places"
      - "Tags, mentions and clickable dates"
      - "Daily journal pages and a calendar"
  zh:
    title: 连接想法
    items:
      - "<code>[[</code> 链接、悬停预览和反向链接"
      - "镜像：同一条目出现在多个地方"
      - "标签、提及与可点击的日期"
      - "每日日记页与日历"
- icon: search
  tint: orange
  en:
    title: Find anything
    items:
      - "⌘P to jump to any bullet or create a page"
      - "Search with filters for tags, to-dos, dates and recent changes"
      - "Starred pages, saved searches and <code>is:new</code> for unread imports"
  zh:
    title: 查找一切
    items:
      - "⌘P 跳转到任意条目，或新建页面"
      - "按标签、待办、日期、最近修改筛选搜索"
      - "收藏页面、保存搜索，用 <code>is:new</code> 找未读条目"
- icon: lock
  tint: teal
  en:
    title: Keep and share your notes
    items:
      - "Local storage with no accounts, cloud sync or tracking"
      - "Share a branch with its images as a <code>.flowie</code> file"
      - "Preview imports and merge updates to shared branches"
      - "Import and export OPML, Markdown and plain text"
  zh:
    title: 保存和分享笔记
    items:
      - "保存在本地，无需账号，没有云同步或追踪"
      - "把条目、子项和图片打包成 <code>.flowie</code> 文件"
      - "导入分享包前可以预览，收到新版可以合并变更"
      - "导入和导出 OPML、Markdown 和纯文本"
- icon: keyboard
  tint: indigo
  en:
    title: Keyboard and AI
    items:
      - "Every shortcut can be changed, mouse side buttons too"
      - "A built-in tutorial covers every feature"
      - "An MCP server lets AI assistants read — and, if you allow it, edit — your outline"
  zh:
    title: 键盘与 AI
    items:
      - "所有快捷键都能修改，也支持鼠标侧键"
      - "内置教程，覆盖全部功能"
      - "MCP 服务器让 AI 助手读取你的大纲，允许后还能编辑"
