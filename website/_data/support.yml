# Support section on the home page (#support). Values are HTML.
en:
  heading: Support
  id: support-en
  intro: 'Send questions, bug reports or ideas to <a href="mailto:wesleyel@icloud.com?subject=Flowie%20support">wesleyel@icloud.com</a> or open a <a href="https://github.com/wesleyel/flowie/issues">GitHub issue</a>. <b>Help → Send Feedback…</b> fills in your Flowie version and operating system.'
  faq:
    - q: What is Flowie?
      a: "Flowie is a keyboard-first outliner. You can zoom into any bullet, link or mirror it elsewhere, keep a daily journal, and write LaTeX right in your notes."
    - q: Which systems does Flowie run on?
      a: 'Download Flowie for macOS 13 or later (Apple silicon or Intel) or Windows 10 and 11 (64-bit) from <a href="https://github.com/wesleyel/flowie/releases/latest">GitHub Releases</a>. A Linux preview for x86_64 (an AppImage or a tar.gz) is there too, or <a href="https://github.com/wesleyel/flowie/blob/main/docs/building.md">build it from source</a>.'
    - q: Where are my notes stored?
      a: 'Flowie saves your notes in a local SQLite database and keeps attached images in a folder next to it. See <a href="https://github.com/wesleyel/flowie/blob/main/docs/building.md#where-data-lives">where Flowie stores its files on each system</a>.'
    - q: Can I sync across devices?
      a: "Flowie works offline and has no sync service. You can send part of an outline to another device as a <code>.flowie</code> file."
    - q: Can Flowie replace Workflowy?
      a: "If you use Workflowy for nested bullets, mirrors, tags and search, those features are in Flowie too. You can import a Workflowy OPML file directly."
    - q: Can I write math in my notes?
      a: "Yes. Type inline <code>$…$</code> or display <code>$$…$$</code> LaTeX; Flowie renders it natively as you type, with a KaTeX-compatible engine."
    - q: How do I move my notes from Workflowy or another outliner?
      a: "Export from the other app as OPML or Markdown, then use <b>File → Import…</b>."
    - q: How do I back up or export?
      a: "Use the export commands in <b>File</b> to save Markdown, OPML, plain text or a <code>.flowie</code> package. To back up Flowie's data, include the database and its image folder."
    - q: I deleted something by mistake.
      a: "Undo the deletion, or open <b>File → Trash</b>. Deleted bullets stay there for 30 days."
    - q: How do AI assistants connect?
      a: 'Enable access in <b>Settings → Agent</b>, then follow the <a href="https://github.com/wesleyel/flowie/blob/main/docs/mcp.md">MCP setup guide</a> to connect your assistant.'
    - q: Is Flowie free?
      a: "Flowie is free software under the GPL-3.0. Download the open-source version from <a href=\"https://github.com/wesleyel/flowie/releases/latest\">GitHub Releases</a>, install it with <code>brew install --cask wesleyel/tap/flowie</code>, or build it yourself. The Mac App Store version is the same app, signed, sandboxed and updated for you — buying it supports development."
zh:
  heading: 支持
  id: support-zh
  intro: '有问题或建议，可以发邮件到 <a href="mailto:wesleyel@icloud.com?subject=Flowie%20%E5%8F%8D%E9%A6%88">wesleyel@icloud.com</a>，也可以在 <a href="https://github.com/wesleyel/flowie/issues">GitHub</a> 提交。在应用中选择<b>「帮助 → 发送反馈…」</b>，会自动附上 Flowie 和系统版本。'
  faq:
    - q: Flowie 是什么？
      a: "Flowie 是一款可以用键盘操作的大纲笔记。每个条目都能点进去当一页用。你可以链接或镜像条目、写日记，也可以在笔记里写 LaTeX 公式。"
    - q: Flowie 支持哪些系统？
      a: 'macOS 13 及以上（Apple 芯片和 Intel）和 Windows 10、11（64 位）可以从 <a href="https://github.com/wesleyel/flowie/releases/latest">GitHub Releases</a> 下载。那里也有 x86_64 的 Linux 预览版（AppImage 或 tar.gz），也可以<a href="https://github.com/wesleyel/flowie/blob/main/docs/building.md">从源码构建</a>。'
    - q: 笔记保存在哪里？
      a: '笔记保存在本地 SQLite 数据库里，图片放在数据库旁边的文件夹里。<a href="https://github.com/wesleyel/flowie/blob/main/docs/building.md#where-data-lives">查看各系统的保存位置</a>。'
    - q: 可以在不同设备间同步吗？
      a: "Flowie 可以离线使用，没有云同步。要把部分大纲传到另一台设备，可以导出为 <code>.flowie</code> 文件。"
    - q: 可以替代 Workflowy 吗？
      a: "Flowie 也支持嵌套条目、镜像、标签和搜索。Workflowy 导出的 OPML 可以直接导入。"
    - q: 能在笔记里写公式吗？
      a: "可以。输入行内 <code>$…$</code> 或独立 <code>$$…$$</code> LaTeX 公式，Flowie 会用兼容 KaTeX 的引擎在输入时原生渲染。"
    - q: 如何从 Workflowy 等大纲工具迁移？
      a: "在原应用中导出 OPML 或 Markdown，然后在 Flowie 中选择<b>「文件 → 导入…」</b>。"
    - q: 如何备份或导出？
      a: "在<b>「文件」</b>菜单里可以导出 Markdown、OPML、纯文本或 <code>.flowie</code> 分享包。备份 Flowie 数据时，记得把数据库和旁边的图片文件夹一起备份。"
    - q: 误删了内容怎么办？
      a: "可以撤销，也可以打开<b>「文件 → 废纸篓」</b>恢复。删除的条目会保留 30 天。"
    - q: 如何连接 AI 助手？
      a: '在<b>「设置 → Agent」</b>中允许访问，再按 <a href="https://github.com/wesleyel/flowie/blob/main/docs/mcp.md">MCP 配置指南</a>连接助手。'
    - q: Flowie 免费吗？
      a: "Flowie 是以 GPL-3.0 授权的自由软件。可以从 <a href=\"https://github.com/wesleyel/flowie/releases/latest\">GitHub Releases</a> 下载开源版、用 <code>brew install --cask wesleyel/tap/flowie</code> 安装，或自行编译。Mac App Store 版本是同一个应用，已签名、沙盒保护并自动更新——购买它就是对开发的支持。"
