[workspace]
resolver = "2"
members = ["crates/flowie-core", "crates/flowie-doc", "crates/flowie-math", "crates/flowie-app"]
exclude = ["third_party/gpui-pre-macos"]

[workspace.package]
version = "1.0.1"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/wesleyel/flowie"

# Style lints that don't fit a GPUI app (many-argument render helpers, nested closure types).
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"

[workspace.dependencies]
# Zed's GPUI through Longbridge's gpui-kit (weekly gpui-pre snapshots), core only: Flowie draws
# its own controls (crates/flowie-app/src/ui). Named `gpui` so `use gpui::…` paths stay as is.
gpui = { package = "gpui-kit", version = "=0.10.0", default-features = false }
ratex-parser = "0.1.16"
ratex-layout = "0.1.16"
ratex-types = "0.1.16"
ratex-katex-fonts = "0.1.16"
flowie-core = { path = "crates/flowie-core" }
flowie-doc = { path = "crates/flowie-doc" }
flowie-math = { path = "crates/flowie-math" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 2


# gpui-pre-macos (pulled in by gpui-kit) with its private AppKit selectors removed, since
# App Review rejects binaries that reference non-public APIs (guideline 2.5.1).
# See third_party/gpui-pre-macos/FLOWIE-PATCH.md.
[patch.crates-io]
gpui-pre-macos = { path = "third_party/gpui-pre-macos" }
