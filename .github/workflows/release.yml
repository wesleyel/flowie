name: Desktop Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      marketing: ${{ steps.version.outputs.marketing }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          marketing=$(bash scripts/release-notes.sh --version)
          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            bash scripts/release-notes.sh "$version" > /dev/null
            bash scripts/check-formats.sh "$version"
          else
            bash scripts/check-formats.sh
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            version="$marketing-test.${GITHUB_SHA:0:8}"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS universal
            runner: macos-latest
            package: macos
          - platform: Windows x64
            runner: windows-latest
            package: windows-x64
          - platform: Linux x86_64
            runner: ubuntu-22.04
            package: linux-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MARKETING_VERSION: ${{ needs.prepare.outputs.marketing }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: bash scripts/linux-deps.sh package
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-packages
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and smoke-test the macOS archive
        if: runner.os == 'macOS'
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p flowie-app --target "$target"
          done
          mkdir -p build dist
          lipo -create -output build/flowie \
            target/aarch64-apple-darwin/release/flowie target/x86_64-apple-darwin/release/flowie
          architectures=$(lipo -archs build/flowie)
          for architecture in arm64 x86_64; do
            if ! grep -qw "$architecture" <<< "$architectures"; then
              echo "Missing $architecture slice in build/flowie (found: $architectures)" >&2
              exit 1
            fi
          done
          app=$(FLOWIE_VERSION="$MARKETING_VERSION" scripts/bundle-macos.sh build/flowie Flowie flowie.spokey.cn)
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(git rev-list --count HEAD)" "$plist"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationCategoryType string public.app-category.productivity" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string en" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string zh-Hans" "$plist"
          plutil -lint "$plist"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          zip="dist/Flowie-$VERSION-macos.zip"
          ditto -c -k --keepParent "$app" "$zip"
          ditto -x -k "$zip" "$RUNNER_TEMP/smoke"
          executable="$RUNNER_TEMP/smoke/Flowie.app/Contents/MacOS/Flowie"
          python3 scripts/smoke-mcp.py "$executable"
          export FLOWIE_DB="$RUNNER_TEMP/smoke.sqlite"
          "$executable" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 10
          kill -0 "$pid"
          test -s "$FLOWIE_DB"
          perl -e 'alarm 30; exec @ARGV' "$executable" --background
          kill -0 "$pid"
      - name: Build and smoke-test the Windows archive
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --locked -p flowie-app --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path build/Flowie,dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/flowie.exe build/Flowie/Flowie.exe
          Copy-Item LICENSE build/Flowie/LICENSE
          $zip = "dist/Flowie-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path build/Flowie -DestinationPath $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP/smoke"
          python scripts/smoke-mcp.py "$env:RUNNER_TEMP/smoke/Flowie/Flowie.exe"
      - name: Build and smoke-test Linux preview packages
        if: runner.os == 'Linux'
        run: |
          tool="$RUNNER_TEMP/appimagetool"
          curl --fail --location --retry 3 -o "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" | sha256sum --check
          chmod +x "$tool"
          cargo build --release --locked -p flowie-app
          desktop-file-validate assets/linux/flowie.spokey.cn.desktop
          xmllint --noout assets/linux/flowie.spokey.cn.xml
          APPIMAGETOOL="$tool" FLOWIE_VERSION="$VERSION" scripts/bundle-linux.sh target/release/flowie dist
          base="dist/Flowie-$VERSION-linux-x86_64"
          mkdir -p "$RUNNER_TEMP/prefix"
          tar -xzf "$base.tar.gz" -C "$RUNNER_TEMP/prefix" --strip-components=1
          python3 scripts/smoke-mcp.py "$RUNNER_TEMP/prefix/bin/flowie"
          APPIMAGE_EXTRACT_AND_RUN=1 python3 scripts/smoke-mcp.py "$base.AppImage"
          # The bundled xkbcommon libraries must win over the system's (scripts/bundle-linux.sh).
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$base.AppImage" --appimage-extract >/dev/null)
          ldd "$RUNNER_TEMP/squashfs-root/usr/bin/flowie" | tee "$RUNNER_TEMP/ldd.txt" | grep 'squashfs-root/usr/lib/'
          for lib in libxkbcommon.so.0 libxkbcommon-x11.so.0 libxcb-xkb.so.1; do
            grep -q "$lib => .*/squashfs-root/usr/lib/$lib" "$RUNNER_TEMP/ldd.txt" || { echo "$lib isn't the bundled one"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: flowie-${{ matrix.package }}
          path: dist/Flowie-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish all desktop packages
    needs: [prepare, package]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: flowie-publish
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: flowie-*
          path: dist
          merge-multiple: true
      - name: Verify the complete asset set and generate checksums
        working-directory: dist
        run: |
          for suffix in macos.zip windows-x64.zip linux-x86_64.tar.gz linux-x86_64.AppImage; do
            file="Flowie-$VERSION-$suffix"
            test -s "$file"
            sha256sum "$file" > "$file.sha256"
          done
      - name: Publish from a draft after all uploads succeed
        run: |
          bash scripts/release-notes.sh "$VERSION" --github > "$RUNNER_TEMP/notes.md"
          prerelease=false
          latest_flag=--latest=false
          if [[ "$VERSION" == *-rc.* ]]; then
            prerelease=true
          else
            latest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[] | select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .tag_name' \
              | sort -V | tail -n 1)
            if [[ $(printf '%s\n' "$GITHUB_REF_NAME" "$latest" | sort -V | tail -n 1) == "$GITHUB_REF_NAME" ]]; then
              latest_flag=--latest
            fi
          fi
          if ! draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Flowie $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$prerelease"
            draft=true
          fi
          if [[ "$draft" == true ]]; then
            gh release upload "$GITHUB_REF_NAME" dist/Flowie-* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$prerelease" \
              --notes-file "$RUNNER_TEMP/notes.md" "$latest_flag"
          fi
          gh release view "$GITHUB_REF_NAME" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

  homebrew:
    name: Update Homebrew for the newest release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    concurrency:
      group: flowie-homebrew
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find the newest published tag (including RCs)
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$"))) | .tag_name' \
            | sed 's/-rc\./~rc./' | sort -V | tail -n 1 | sed 's/~rc\./-rc./')
          if [[ "$latest" != "$GITHUB_REF_NAME" ]]; then exit 0; fi
          checksum="Flowie-$VERSION-macos.zip.sha256"
          gh release download "$GITHUB_REF_NAME" --pattern "$checksum" --dir "$RUNNER_TEMP"
          echo "checksum=$RUNNER_TEMP/$checksum" >> "$GITHUB_OUTPUT"
      - name: Update the cask
        if: steps.newest.outputs.checksum != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          CHECKSUM: ${{ steps.newest.outputs.checksum }}
        run: scripts/update-tap-cask.sh "$VERSION" "$CHECKSUM"
