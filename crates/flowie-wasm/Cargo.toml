[package]
name = "flowie-wasm"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish.workspace = true

# Flowie in the browser (M4, docs/roadmap/ios-cross-platform.md): the document layer and the
# sync engine compiled to wasm, with SQLite inside. JavaScript does the network calls (fetch)
# and draws the page; every read and write goes through flowie-doc.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flowie-core = { path = "../flowie-core", default-features = false, features = ["store"] }
flowie-doc = { path = "../flowie-doc", default-features = false }
flowie-sync.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# SQLite for wasm32-unknown-unknown, with its host functions from wasm-bindgen.
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
