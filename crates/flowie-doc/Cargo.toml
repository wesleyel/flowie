[package]
name = "flowie-doc"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["native"]
# Threads: the background database writer, the sync driver's network threads and the image
# clean-up. Without it the crate builds for the browser (wasm), where each change is saved at
# once and the page drives sync with fetch.
native = ["flowie-core/writer-thread"]

[dependencies]
flowie-core = { path = "../flowie-core", default-features = false, features = ["store"] }
flowie-sync.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
