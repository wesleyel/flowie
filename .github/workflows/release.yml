name: Release

# Push a tag vX.Y.Z (matching Cargo.toml) to publish a GitHub release whose notes are that
# version's section of CHANGELOG.md, with the open-source version: Flowie-X.Y.Z-macos.zip, a universal
# (arm64 + x86_64) build of the tag, ad-hoc signed and not notarized, unsandboxed like a source
# build. The macos-app job then updates the cask in wesleyel/homebrew-tap (needs the
# HOMEBREW_TAP_GITHUB_TOKEN secret). The signed, sandboxed app is distributed through the Mac
# App Store.
#
# Release candidates come first: a tag vX.Y.Z-rc.N (Cargo.toml still says X.Y.Z, which is what
# the App Store gets) publishes a pre-release, Flowie-X.Y.Z-rc.N-macos.zip, and updates the
# flowie@beta cask. Once it holds up, tag vX.Y.Z: a stable release, marked latest, and the
# flowie cask.
on:
  push:
    tags: ["v*"]
  # Rewrites an existing release's notes from main's CHANGELOG.md, e.g. after fixing an entry.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)publish, e.g. v1.0.0 or v1.0.0-rc.1
        required: true
      build:
        description: Also rebuild and re-upload the macOS app zip
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag matches its Cargo version
        run: |
          # vX.Y.Z, or vX.Y.Z-rc.N for a release candidate of X.Y.Z.
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::tag $TAG is neither vX.Y.Z nor vX.Y.Z-rc.N"
            exit 1
          fi
          version=$(git show "$TAG:Cargo.toml" | sed -nE '/^\[workspace.package\]/,/^\[/ s/^version = "(.*)"/\1/p')
          base=${TAG%%-*}
          if [ "v$version" != "$base" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          {
            scripts/changelog-section.sh "${TAG#v}"
            echo
            echo "---"
            echo
            if [[ $TAG == *-rc.* ]]; then
              echo "**This is a release candidate**, for trying out before ${TAG%%-*} is final: \`brew install --cask wesleyel/tap/flowie@beta\`, or the zip below."
              echo
            fi
            echo "**Get Flowie** on the [Mac App Store](https://apps.apple.com/app/id6835913837) (signed, sandboxed, updated automatically), download the open-source version, **Flowie-${TAG#v}-macos.zip**, below, or [build it from source](https://github.com/wesleyel/flowie/blob/$TAG/docs/building.md)."
            echo
            echo "The zip is a universal app for macOS 13 or later that isn't notarized, so macOS blocks the first launch: unzip it, move Flowie.app to Applications, then right-click it and choose **Open** (on macOS 15 or later: open it once, then **System Settings → Privacy & Security → Open Anyway**). Or run \`xattr -dr com.apple.quarantine /Applications/Flowie.app\`. It doesn't update itself."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Flowie ${TAG#v}"
          # A release candidate is a pre-release; a final version becomes the latest release.
          if [[ $TAG == *-rc.* ]]; then kind=(--prerelease); else kind=(--prerelease=false --latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${kind[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${kind[@]}"
          fi

  macos-app:
    name: macOS app zip
    needs: release
    # A tag push always builds; a manual run only when asked (it usually just fixes the notes).
    if: github.event_name == 'push' || inputs.build
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build a universal binary
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p flowie-app --target "$t"
          done
          mkdir -p build
          lipo -create -output build/flowie \
            target/aarch64-apple-darwin/release/flowie target/x86_64-apple-darwin/release/flowie
          lipo -archs build/flowie
      - name: Bundle and zip
        run: |
          app=$(scripts/bundle-macos.sh build/flowie Flowie flowie.spokey.cn)
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(git rev-list --count HEAD)" "$plist"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationCategoryType string public.app-category.productivity" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string en" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string zh-Hans" "$plist"
          plutil -lint "$plist"
          # Editing Info.plist breaks the signature bundle-macos.sh made; sign again.
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          # A release candidate's app says X.Y.Z, like the App Store build; its zip says X.Y.Z-rc.N.
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          [ "v$version" = "${TAG%%-*}" ] || { echo "::error::app version $version does not match $TAG"; exit 1; }
          zip="build/Flowie-${TAG#v}-macos.zip"
          # ditto keeps the bundle's symlinks, permissions and signature intact.
          ditto -c -k --keepParent "$app" "$zip"
          (cd build && shasum -a 256 "$(basename "$zip")") | tee "$zip.sha256"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Smoke test (launch, then quit)
        run: |
          FLOWIE_DB="$RUNNER_TEMP/smoke.sqlite" build/Flowie.app/Contents/MacOS/Flowie &
          pid=$!
          sleep 10
          kill -0 "$pid"
          kill "$pid"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
      - name: Update the Homebrew cask
        # In wesleyel/homebrew-tap: Casks/flowie.rb takes final versions
        # (`brew install --cask wesleyel/tap/flowie`); Casks/flowie@beta.rb takes release
        # candidates and final versions alike, so it is never behind.
        # A failure here leaves the release and its zip in place; fix the token and re-run.
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          scripts/update-tap-cask.sh "${TAG#v}" "$ZIP.sha256" flowie@beta
          if [[ $TAG != *-rc.* ]]; then
            scripts/update-tap-cask.sh "${TAG#v}" "$ZIP.sha256" flowie
          fi
