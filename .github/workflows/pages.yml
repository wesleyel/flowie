name: Website

# Builds website/ with Jekyll and publishes it to GitHub Pages: https://wesleyel.github.io/flowie/
# (home page, privacy policy and terms of use — the App Store listing and the app's Help
# menu link to /flowie/, /flowie/privacy.html, /flowie/terms.html and /flowie/#support).
on:
  pull_request:
    paths: [website/**, .github/workflows/pages.yml]
  push:
    branches: [main]
    paths: [website/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build and deploy are separate jobs: deploy-pages lists the run's artifacts, and right after
  # an upload in the same job that list can still be empty ("No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./website
          destination: ./_site
      - name: Check links and images in the built site
        # Every href/src on this site must resolve to a file in _site: /flowie/... and
        # https://wesleyel.github.io/flowie/... map to _site/..., a trailing / to index.html,
        # and a #fragment must match an id in the target page.
        run: |
          cd _site
          rc=0
          while IFS= read -r f; do
            dir=$(dirname "$f")
            while IFS= read -r ref; do
              case "$ref" in
                https://wesleyel.github.io/flowie/*) path="./${ref#https://wesleyel.github.io/flowie/}" ;;
                /flowie/*) path="./${ref#/flowie/}" ;;
                /flowie) path="./" ;;
                http:*|https:*|mailto:*|//*) continue ;;
                /*) echo "$f: $ref is missing the /flowie base path"; rc=1; continue ;;
                \#*) path="$f$ref" ;;
                *) path="$dir/$ref" ;;
              esac
              frag=""
              case "$path" in *\#*) frag="${path#*#}"; path="${path%%#*}" ;; esac
              path="${path%%\?*}"
              case "$path" in */|.) path="${path%/}/index.html" ;; esac
              if [ ! -f "$path" ]; then
                echo "$f: $ref -> missing $path"; rc=1
              elif [ -n "$frag" ] && ! grep -q "id=\"$frag\"" "$path"; then
                echo "$f: $ref -> no id=\"$frag\" in $path"; rc=1
              fi
            done < <(grep -oE '(href|src)="[^"]*"' "$f" | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          done < <(find . -name '*.html' | sort)
          exit $rc
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: ./_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
