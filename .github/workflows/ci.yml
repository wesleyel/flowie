name: CI

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'README.*.md'
      - 'docs/**'
      - 'website/**'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README.*.md'
      - 'docs/**'
      - 'website/**'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    name: Formatting, changelogs, formats and wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - name: Check bilingual changelogs
        run: bash scripts/release-notes.sh --check
      - name: Check database formats
        run: bash scripts/check-formats.sh
      - run: cargo check --locked -p flowie-core -p flowie-sync --no-default-features --target wasm32-unknown-unknown

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest
          - platform: Linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/linux-deps.sh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
