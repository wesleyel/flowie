<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}Flowie — {{ page.title }}{% else %}Flowie — Keyboard-first outliner for Mac{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="{% if page.title %}Flowie — {{ page.title }}{% else %}Flowie — Keyboard-first outliner for Mac{% endif %}">
<meta property="og:description" content="{{ page.og_description | default: page.description | default: site.description }}">
<meta property="og:image" content="{{ '/images/01-outline-en-US.jpg' | absolute_url }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/images/icon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/icon.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
<script src="{{ '/lang.js' | relative_url }}"></script>
</head>
<body>
<a class="skip" href="#content"><span lang="en">Skip to content</span><span lang="zh-CN">跳到正文</span></a>
{% include nav.html %}
{%- if page.layout == 'page' %}{% assign main_class = 'container narrow page-main' %}{% else %}{% assign main_class = page.main_class | default: 'container' %}{% endif %}
<main id="content" class="{{ main_class }}">
{{ content }}
</main>
{% include footer.html %}
</body>
</html>
