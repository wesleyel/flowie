<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#3b82f6">
<style>
  :root { color-scheme: light dark; --muted: #888; --accent: #3b82f6; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  #status { font-size: 12px; color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; }
  li.done .text { color: var(--muted); text-decoration: line-through; }
  .text { flex: 1; outline: none; min-width: 1em; }
  #crumbs { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  #starred { font-size: 13px; margin-bottom: 4px; }
  #starred a { color: var(--accent); text-decoration: none; }
  #search { font: inherit; padding: 2px 8px; width: 12em; }
  .star { border: none; background: none; color: var(--muted); cursor: pointer; visibility: hidden; }
  .star.on { color: #e5a400; visibility: visible; }
  li:hover .star { visibility: visible; }
  .body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .image { max-width: 100%; max-height: 360px; object-fit: contain; align-self: flex-start; border-radius: 4px; }
  #crumbs a, .dot { color: inherit; text-decoration: none; }
  .dot { width: 1em; text-align: center; }
  .fold { width: 1.4em; border: none; background: none; color: var(--muted); padding: 0; cursor: pointer; }
  .remove { border: none; background: none; color: var(--muted); cursor: pointer; visibility: hidden; }
  li:hover .remove { visibility: visible; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  form input { flex: 1; font: inherit; padding: 4px 8px; }
  .setup { display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
  .setup input { font: inherit; padding: 4px 8px; }
</style>
</head>
<body>
<header><h1>Flowie</h1><input id="search" type="search" placeholder="Search" autocomplete="off"><button id="today">Today</button><span id="status">starting…</span></header>
<nav id="starred"></nav>
<nav id="crumbs"></nav>
<main id="main"></main>
<script type="module" src="dist/app.js"></script>
</body>
</html>
