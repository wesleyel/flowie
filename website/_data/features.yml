# Home page feature bento (#features). `icon` picks a glyph in _includes/icon.html;
# `size` is wide (half a row, with `shot`: images/<shot>-<locale>.jpg) or full (a whole row);
# small tiles fill a third of a row. Core features only.
- icon: write
  size: wide
  shot: 01-outline
  en: { title: Every bullet is a page, text: "Zoom in to focus on one idea, zoom out for the big picture. Headings, to-dos, quotes, code blocks and images." }
  zh: { title: 每个条目都是一页, text: "进入一个条目专注细节，退出来纵览全局。支持标题、待办、引用、代码块和图片。" }
- icon: keyboard
  size: wide
  shot: 02-quick-open
  en: { title: Jump anywhere with ⌘P, text: "Open any page, or start a new one, without touching the mouse. Every command is a shortcut or a <code>/</code> away." }
  zh: { title: ⌘P 直达任意页面, text: "不碰鼠标就能打开任意页面或新建一页。所有命令都有快捷键，或者输入 <code>/</code> 调出。" }
- icon: sync
  size: full
  en: { title: Sync through iCloud, text: "The App Store version keeps your outline in step on Mac, iPhone and iPad through your private iCloud database, with nothing to set up. The desktop and web versions can also sync through a server you run yourself." }
  zh: { title: 通过 iCloud 同步, text: "App Store 版通过你的私有 iCloud 数据库，让 Mac、iPhone 和 iPad 上的大纲保持一致，无需任何设置。桌面版和网页版也可以通过你自己运行的服务器同步。" }
- icon: math
  en: { title: "Math, natively", text: "Inline <code>$…$</code> and display <code>$$…$$</code> LaTeX, rendered as you type." }
  zh: { title: 原生数学公式, text: "行内 <code>$…$</code> 与独立 <code>$$…$$</code> LaTeX 公式，输入时即时渲染。" }
- icon: link
  en: { title: Links and mirrors, text: "<code>[[</code> links with previews and backlinks. One bullet, in as many places as you need." }
  zh: { title: 链接与镜像, text: "<code>[[</code> 链接，带预览和反向链接。同一个条目可以出现在多个地方。" }
- icon: calendar
  en: { title: Journal and calendar, text: "A page for every day, connected to everything else." }
  zh: { title: 日记与日历, text: "每天一页日记，与其他所有想法相连。" }
- icon: search
  en: { title: Search everything, text: "Filter by tags, to-dos, dates and the words you remember." }
  zh: { title: 搜索一切, text: "按标签、待办、日期和你记得的字词筛选。" }
- icon: lock
  en: { title: Private by default, text: "No account and no tracking. Export Markdown, OPML or text any time." }
  zh: { title: 默认私密, text: "无需账号，没有追踪。随时导出 Markdown、OPML 或纯文本。" }
- icon: plug
  en: { title: Bring your AI, text: "Connect an assistant over MCP. You decide what it can read and write." }
  zh: { title: 接入 AI, text: "通过 MCP 连接智能助手，由你决定它能读写什么。" }
