# cargo-about: third-party notices bundled in the Mac App Store build
# (Contents/Resources/ThirdPartyNotices.txt, not shown in the UI) and, for flowie-ffi, in the
# iOS app (scripts/package-ios.sh; Settings → About → Open-Source Notices).
accepted = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unlicense", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD", "OpenSSL",
    "CDLA-Permissive-2.0",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
no-clearly-defined = true
private = { ignore = true }
