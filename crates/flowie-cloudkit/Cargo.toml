[package]
name = "flowie-cloudkit"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish.workspace = true

# iCloud sync for the desktop app on macOS (wiki: Per-Node-Sync §5.2): FlowieCloudKit's Swift
# sources (apple/FlowieKit/Sources/FlowieCloudKit, shared with the iOS app) and a small C
# bridge (swift/Bridge.swift) are compiled by build.rs into a static library linked into the
# GPUI binary. On other systems, or without a Swift compiler (FLOWIE_CLOUDKIT=0 skips it),
# the crate builds without it and says iCloud is unavailable.

[dependencies]
flowie-doc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
