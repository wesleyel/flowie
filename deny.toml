# cargo-deny: every dependency's license must be compatible with Flowie's GPL-3.0-or-later
# (the same list appstore/macos/about.toml bundles notices for). CI runs `cargo deny check`.
[graph]
# wasm32: flowie-core is checked for the browser in CI, so its wasm-only dependencies count too.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
all-features = false

[licenses]
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unlicense", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Crate boundaries (docs/roadmap/ios-cross-platform.md §3.4): only the listed crates may depend
# on these *directly*. A crate that reaches one through another workspace crate isn't caught here.
deny = [
    { crate = "gpui-kit", wrappers = ["flowie-app", "flowie-math"], reason = "the UI stays out of the model crates" },
    { crate = "rusqlite", wrappers = ["flowie-core"], reason = "SQL lives in flowie-core's store" },
]

[advisories]
# "Unmaintained" notices count only for crates Flowie depends on directly; the ones deep in
# GPUI's tree are GPUI's to replace. Vulnerabilities fail CI wherever they are.
unmaintained = "workspace"
ignore = [
    # chrono: only Local::now() and date arithmetic; no maintained drop-in yet. Revisit with jiff.
    { id = "RUSTSEC-2026-0543", reason = "no maintained replacement yet; dates only, no parsing of untrusted input" },
    # ttf-parser: flowie-math reads glyph metrics from the bundled math font only, and GPUI's
    # usvg/fontdb use it too, so it goes when they move.
    { id = "RUSTSEC-2026-0192", reason = "parses only the bundled font; shared with GPUI's tree" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
