name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "website/**", "assets/**", "appstore/fastlane/metadata/**", "appstore/fastlane/screenshots/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "website/**", "assets/**", "appstore/fastlane/metadata/**", "appstore/fastlane/screenshots/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are dropped; main runs finish so they can save the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI builds once and throws the result away: no debug info, no incremental state.
  # Smaller target/ means a smaller cache to save and restore.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: CHANGELOG.md has an entry for the Cargo version
        # Release notes come from it (scripts/changelog-section.sh, release.yml). Before
        # X.Y.Z itself ships, its release candidates' X.Y.Z-rc.N sections count.
        run: |
          version=$(sed -nE '/^\[workspace.package\]/,/^\[/ s/^version = "(.*)"/\1/p' Cargo.toml)
          if scripts/changelog-section.sh "$version" > /dev/null 2>&1; then exit 0; fi
          rc=$(sed -nE "s/^## \[(${version//./\\.}-rc\.[0-9]+)\].*/\1/p" CHANGELOG.md | head -n 1)
          [ -n "$rc" ] || { echo "::error::CHANGELOG.md has no entry for $version or a $version-rc.N"; exit 1; }
          scripts/changelog-section.sh "$rc" > /dev/null

  deny:
    name: licenses and advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  check:
    name: clippy, test and build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache; pull requests (Dependabot opens many) restore
          # main's instead of each saving a multi-GB copy and evicting it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Build the app bundle
        # A debug build reuses what `cargo test` just compiled; the release build is made
        # locally for the App Store (appstore/README.md), so CI doesn't compile everything twice.
        run: |
          cargo build --locked -p flowie-app
          scripts/bundle-macos.sh target/debug/flowie Flowie flowie.spokey.cn
          plutil -lint build/Flowie.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Flowie.app/Contents/Info.plist
      - name: Smoke test (launch, then quit)
        run: |
          FLOWIE_DB="$RUNNER_TEMP/smoke.sqlite" build/Flowie.app/Contents/MacOS/Flowie &
          pid=$!
          sleep 10
          kill -0 "$pid"   # still running: it started without crashing
          kill "$pid"

  check-windows:
    name: clippy, test and build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --locked -p flowie-app
      - name: Smoke test (MCP stdio)
        shell: pwsh
        run: |
          $input = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}',
            '{"jsonrpc":"2.0","id":2,"method":"ping","params":{}}'
          ) -join "`n"
          $out = $input | .\target\debug\flowie.exe mcp
          $out | ForEach-Object { Write-Host $_ }
          if (-not ($out -join "`n" -match '"name":"flowie"')) { throw "MCP initialize failed" }
          if (-not ($out -join "`n" -match '"id":2')) { throw "MCP ping failed" }
