[package]
name = "flowie-sync"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish.workspace = true

# Per-node sync: the wire format, the merge, and the engine that drives it. No IO and no
# threads, so it builds for wasm too (docs/roadmap/per-node-sync.md §4).
[dependencies]
flowie-core = { path = "../flowie-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
